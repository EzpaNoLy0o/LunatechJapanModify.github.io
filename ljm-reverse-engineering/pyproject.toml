[project]
name = "ljm-reverse-engineering"
version = "0.2.0"
description = "LJM Reverse Engineering - 3D スキャンデータからのリバースエンジニアリング支援ソフト"
requires-python = ">=3.11,<3.13"
readme = "README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::pyvista.core.errors.PyVistaDeprecationWarning",
]
