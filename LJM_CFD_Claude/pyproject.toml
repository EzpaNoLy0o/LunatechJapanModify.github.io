[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ljmcfd"
version = "0.1.0"
description = "LJM CFD (Claude edition) - automotive aerodynamics CFD workbench for Windows 11"
requires-python = ">=3.12,<3.13"
dynamic = ["dependencies"]

[project.scripts]
ljmcfd = "ljmcfd.__main__:main"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
qt_api = "pyside6"
markers = ["gui: tests that need a display (xvfb or a real desktop)"]
